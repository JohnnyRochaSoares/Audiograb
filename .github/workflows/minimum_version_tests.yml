name: Minimum Version Tests

on:
  push:
  pull_request:

jobs:
  downloader:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        yt_dlp_version: ["2021.06.01", "2021.06.08", "2021.06.09", "2021.06.23", "2021.07.07", "2021.07.07", "2021.07.21", "2021.07.23", "2021.08.02", "2021.08.10", "2021.09.10", "2021.09.02", "2021.09.25", "2021.10.09", "2021.10.10", "2021.10.22", "2021.11.10", "2021.11.10.1", "2021.12.01", "2021.12.25", "2021.12.27", "22.1.21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e . --no-deps
      - run: pip install "PySide6==6.2.2" "yt-dlp==${{ matrix.yt_dlp_version }}" "pytest==6.2.4"
      - run: pytest tests/test_downloader.py -v

name: pytest Minimum Version

on:
  push:
  pull_request:

jobs:
  downloader:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pytest_version: ["6.0.0", "6.0.1", "6.0.2", "6.1.0", "6.1.1", "6.1.2", "6.2.0", "6.2.1", "6.2.2", "6.2.3", "6.2.4", "6.2.5", "7.0.0", "7.0.1", "7.1.0", "7.1.1", "7.1.2", "7.1.3", "7.2.0", "7.2.1", "7.2.2", "7.3.0", "7.3.1", "7.3.2", "7.4.0", "7.4.1", "7.4.2", "7.4.3", "7.4.4", "8.0.0", "8.0.1", "8.0.2", "8.1.0", "8.1.1", "8.1.2", "8.2.0", "8.2.1", "8.2.2", "8.3.0", "8.3.1", "8.3.2", "8.3.3", "8.3.4", "8.3.5", "8.4.0", "8.4.1", "8.4.2", "9.0.0", "9.0.1", "9.0.2", "9.0.3", "9.1.0", "9.1.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e . --no-deps
      - run: pip install "PySide6==6.6.0" "yt-dlp==2024.1.1" "pytest==${{ matrix.pytest_version }}"
      - run: pytest tests/test_downloader.py -v
        continue-on-error: true

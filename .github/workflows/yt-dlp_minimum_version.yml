name: yt-dlp Minimum Version

on:
  push:
  pull_request:

jobs:
  downloader:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        yt_dlp_version: ["2021.1.16", "2021.1.20", "2021.1.24", "2021.1.24.post1", "2021.1.29", "2021.2.4", "2021.2.9", "2021.2.15", "2021.2.19", "2021.2.24", "2021.3.1", "2021.3.3.2", "2021.3.7", "2021.3.15", "2021.3.21", "2021.3.24.1", "2021.4.3", "2021.4.11", "2021.4.22", "2021.5.11", "2021.5.20", "2021.6.1", "2021.6.9", "2021.6.23", "2021.7.7", "2021.7.21", "2021.7.24", "2021.8.2", "2021.8.10", "2021.9.1", "2021.9.2", "2021.9.25", "2021.10.9", "2021.10.10", "2021.10.22", "2021.11.10", "2021.11.10.1", "2021.12.1", "2021.12.25", "2021.12.27", "2022.1.21", "2022.2.3", "2022.2.4", "2022.3.8", "2022.3.8.1", "2022.3.8.2", "2022.4.8", "2022.5.18", "2022.6.22", "2022.6.22.1", "2022.6.29", "2022.7.17", "2022.7.18", "2022.8.8", "2022.8.14", "2022.8.19", "2022.9.1", "2022.10.4", "2022.11.11", "2023.1.2", "2023.1.6", "2023.2.17", "2023.3.3", "2023.3.4", "2023.6.21", "2023.6.22", "2023.7.6", "2023.9.24", "2023.10.7", "2023.10.13", "2023.11.14", "2023.11.16", "2023.12.30", "2024.3.10", "2024.4.9", "2024.5.26", "2024.5.27", "2024.7.1", "2024.7.2", "2024.7.7", "2024.7.8", "2024.7.9", "2024.7.16", "2024.7.25", "2024.8.1", "2024.8.6", "2024.9.27", "2024.10.7", "2024.10.22", "2024.11.4", "2024.11.18", "2024.12.3", "2024.12.6", "2024.12.13", "2024.12.23", "2025.1.12", "2025.1.15", "2025.1.26", "2025.2.19", "2025.3.21", "2025.3.25", "2025.3.26", "2025.3.27", "2025.3.31", "2025.4.30", "2025.5.22", "2025.6.9", "2025.6.25", "2025.6.30", "2025.7.21", "2025.8.11", "2025.8.20", "2025.8.22", "2025.8.27", "2025.9.5", "2025.9.23", "2025.9.26", "2025.10.14", "2025.10.22", "2025.11.12", "2025.12.8", "2026.1.29", "2026.1.31", "2026.2.4", "2026.2.21", "2026.3.3", "2026.3.13", "2026.3.17", "2026.6.9", "2026.7.4", "2026.8.19"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e . --no-deps
      - run: pip install "PySide6==6.3.0" "yt-dlp==${{ matrix.yt_dlp_version }}" "pytest==6.2.4"
      - name: Run tests
        run: |
          if pytest tests/test_downloader.py -v; then
            echo "✅ **yt-dlp ${{ matrix.yt_dlp_version }}** — passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **yt-dlp ${{ matrix.yt_dlp_version }}** — failed" >> "$GITHUB_STEP_SUMMARY"
          fi

name: Python Minimum Version

on:
  push:
  pull_request:

jobs:
  downloader:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.10"
            pyside6_version: "6.3.0"

          - python_version: "3.11"
            pyside6_version: "6.4.0.1"

          - python_version: "3.12"
            pyside6_version: "6.6.0"

          - python_version: "3.13"
            pyside6_version: "6.8.0.2"

          - python_version: "3.14"
            pyside6_version: "6.10.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python_version }}"
      - run: pip install -e . --no-deps
      - run: pip install "PySide6==${{ matrix.pyside6_version }}" "yt-dlp==2021.2.24" "pytest==8.0.0"
      - name: Run tests
        run: |
          if pytest tests/test_downloader.py -v; then
            echo "✅ **Python ${{ matrix.python_version }} (PySide6 ${{ matrix.pyside6_version }})** — passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Python ${{ matrix.python_version }} (PySide6 ${{ matrix.pyside6_version }})** — failed" >> "$GITHUB_STEP_SUMMARY"
          fi

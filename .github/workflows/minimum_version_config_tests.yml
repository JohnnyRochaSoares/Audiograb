name: config.py Minimum Version Tests

on:
  push:
  pull_request:

jobs:
  downloader:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e . --no-deps
      - run: pip install "yt-dlp==2022.5.18" "PySide6==6.10.1" "pytest==7.3.2" "platformdirs==1.0.0"
      - run: pytest tests/test_config.py -v

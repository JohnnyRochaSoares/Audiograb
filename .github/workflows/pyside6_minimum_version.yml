name: PySide6 Minimum Version

on:
  push:
  pull_request:

jobs:
  gui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyside6_version: ["6.3.0", "6.3.1", "6.3.2", "6.4.0.1", "6.4.1", "6.4.2", "6.4.3", "6.5.0", "6.5.1.1", "6.5.2", "6.5.3", "6.6.0", "6.6.1", "6.6.2", "6.6.3", "6.6.3.1", "6.7.0", "6.7.1", "6.7.2", "6.7.3", "6.8.0", "6.8.0.1", "6.8.0.2", "6.8.1", "6.8.1.1", "6.8.2", "6.8.2.1", "6.8.3", "6.9.0", "6.9.1", "6.9.2", "6.9.3", "6.10.0", "6.10.1", "6.10.2", "6.10.3", "6.11.0", "6.11.1", "6.11.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e . --no-deps
      - run: pip install "PySide6==${{ matrix.pyside6_version }}" "yt-dlp==2021.2.24" "pytest==6.2.4"
      - name: Run tests
        run: |
          if pytest tests/ -v; then
            echo "✅ **PySide6 ${{ matrix.pyside6_version }}** — passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **PySide6 ${{ matrix.pyside6_version }}** — failed" >> "$GITHUB_STEP_SUMMARY"
          fi
